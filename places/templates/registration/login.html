<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Вход | СытГУТИ 🍔</title>
    <link rel="stylesheet" href="/static/register_style.css">
</head>
<body>
    
    <form method="post">
        <h2>Вход</h2>
        {% csrf_token %}
        
        <div class="input-box">
            <span>Имя пользователя</span>
            <input type="text" name="username" required>
        </div>
        
        <div class="input-box">
            <span>Пароль</span>
            <input type="password" name="password" required>
        </div>
        
        <button type="submit" class="submit-bin">Войти</button>
        
        <p>Нет аккаунта? <a href="/register/">Зарегистрироваться</a></p>
        <p><a href="/">На главную</a></p>
    </form>
</body>
</html>
