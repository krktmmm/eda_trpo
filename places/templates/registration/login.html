<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Вход | СытГУТИ 🍔</title>
    <link rel="stylesheet" href="/static/register_style.css">
    <style>
        .error-message {
            color: red;
            font-size: 12px;
            margin-top: 5px;
        }
        .input-box.error input {
            border-color: red;
            background-color: #fff0f0;
        }
    </style>
</head>
<body>
    
    <form method="post">
        <h2>Вход</h2>
        {% csrf_token %}
        
        <div class="input-box {% if form.errors %}error{% endif %}">
            <span>Имя пользователя</span>
            <input type="text" name="username" value="{{ form.username.value|default:'' }}" required>
        </div>
        
        <div class="input-box {% if form.errors %}error{% endif %}">
            <span>Пароль</span>
            <input type="password" name="password" required>
        </div>
        
        {% if form.errors %}
            <div class="error-message" style="text-align: center; margin-bottom: 15px;">
                Неверное имя пользователя или пароль. Попробуйте снова.
            </div>
        {% endif %}
        
        <button type="submit" class="submit-bin">Войти</button>
        
        <p>Нет аккаунта? <a href="/register/">Зарегистрироваться</a></p>
        <p><a href="/">На главную</a></p>
    </form>
</body>
</html>
