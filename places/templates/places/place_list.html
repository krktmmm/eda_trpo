<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>СытГУТИ</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    
    <!-- ШАПКА САЙТА -->
    <div class="navigation">
        <!-- ЛОГОТИП -->
        <div class="logo">
            <img src="/static/images/log.png" alt="Логотип">
        </div>
        
        <!-- КНОПКИ -->
        <div class="panel">
            <!-- ПОИСКОВАЯ СТРОКА -->
            <div class="search">
                <input type="text" placeholder="Поиск...">
                <button>
                    <span>🔍</span>
                </button>
            </div>
            
            <!-- МЕНЮ -->
            <div class="menu">
                <a href="/">Главная</a>
                <a href="#">О нас</a>
                <a href="#">Контакты</a>
            </div>
            
            <!-- ПРОФИЛЬ -->
            {% if user.is_authenticated %}
                <a href="/register/profile/" class="profile">
                    <img src="/static/images/avatar.jpg" alt="Профиль">
                </a>
            {% else %}
                <a href="/accounts/login/" class="profile">
                    <img src="/static/images/avatar.jpg" alt="Войти">
                </a>
            {% endif %}    
        </div>
    </div>
    
    <!-- ПРИВЕТСТВИЕ -->
    <div class="greeting">
        <h1>Добро пожаловать в СытГУТИ! 🍔</h1>
        {% if user.is_authenticated %}
            <p>Привет, {{ user.username }}!</p>
        {% endif %}
    </div>
</body>
</html>
